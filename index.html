
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Run 3D</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #bdeaf4;
}

canvas { display: block; }

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  pointer-events: none;
}

.panel {
  background: white;
  padding: 12px 16px;
  border-radius: 12px;
  color: #244b3c;
  font-weight: bold;
  box-shadow: 0 3px 12px #0002;
}

#overlay {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #173b3555;
  padding: 20px;
}

#card {
  background: white;
  color: #244b3c;
  padding: 28px;
  border-radius: 20px;
  text-align: center;
  max-width: 360px;
  width: 100%;
}

button {
  padding: 13px 22px;
  border: none;
  border-radius: 12px;
  background: #ffc83d;
  color: #352800;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#mobile {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
}

#mobile button {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: white;
  font-size: 23px;
}

@media (min-width: 760px) {
  #mobile { display: none; }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="hud">
  <div class="panel">Coins: <span id="score">0</span></div>
  <div class="panel">← → Move | SPACE Jump</div>
</div>

<div id="overlay">
  <div id="card">
    <h1 id="title">Coin Run 3D</h1>
    <p id="message">
      Collect coins, jump over obstacles, and see how long you can survive!
    </p>
    <button id="start">Start Game</button>
  </div>
</div>

<div id="mobile">
  <button id="left">←</button>
  <button id="jump">↑</button>
  <button id="right">→</button>
</div>

<script type="module">
import * as THREE from "three";

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color("#bdeaf4");
scene.fog = new THREE.Fog("#bdeaf4", 25, 90);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  60, innerWidth / innerHeight, 0.1, 200
);
camera.position.set(0, 6, 10);

// RENDERER
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// LIGHTS
scene.add(new THREE.HemisphereLight(0xffffff, 0x62855b, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(-5, 12, 8);
sun.castShadow = true;
scene.add(sun);

// MATERIALS
function material(color) {
  return new THREE.MeshStandardMaterial({
    color,
    flatShading: true
  });
}

const grassMat = material("#73c967");
const roadMat = material("#667780");
const woodMat = material("#98633b");
const goldMat = new THREE.MeshStandardMaterial({
  color: "#ffca28",
  metalness: 0.3,
  roughness: 0.3
});

// GROUND
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(150, 180),
  grassMat
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.2, -60);
ground.receiveShadow = true;
scene.add(ground);

// ROAD
const road = new THREE.Mesh(
  new THREE.BoxGeometry(8, 0.2, 180),
  roadMat
);
road.position.set(0, -0.05, -60);
road.receiveShadow = true;
scene.add(road);

// ROAD LINES
const dashes = [];

for (let z = 12; z > -150; z -= 5) {
  const dash = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.03, 2),
    material("#ffffff")
  );
  dash.position.set(0, 0.07, z);
  scene.add(dash);
  dashes.push(dash);
}

// TREES
function makeTree(x, z) {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.22, 1.1, 5),
    woodMat
  );
  trunk.position.y = 0.55;
  tree.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(0.8, 1.7, 5),
    material("#278b51")
  );
  leaves.position.y = 1.7;
  tree.add(leaves);

  const top = new THREE.Mesh(
    new THREE.ConeGeometry(0.55, 1.2, 5),
    material("#43ad60")
  );
  top.position.y = 2.35;
  tree.add(top);

  tree.position.set(x, 0, z);
  tree.traverse(obj => {
    if (obj.isMesh) obj.castShadow = true;
  });
  scene.add(tree);
}

for (let z = 10; z > -145; z -= 7) {
  makeTree(-6.5, z);
  makeTree(6.5, z - 3);
}

// PLAYER
const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.BoxGeometry(0.8, 1, 0.6),
  material("#f47c52")
);
body.position.y = 0.85;
player.add(body);

const head = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.38, 0),
  material("#ffd0a0")
);
head.position.y = 1.6;
player.add(head);

const hair = new THREE.Mesh(
  new THREE.BoxGeometry(0.7, 0.2, 0.6),
  material("#39434b")
);
hair.position.y = 1.9;
player.add(hair);

for (const x of [-0.22, 0.22]) {
  const leg = new THREE.Mesh(
    new THREE.BoxGeometry(0.23, 0.45, 0.28),
    material("#365b9b")
  );
  leg.position.set(x, 0.23, 0);
  player.add(leg);
}

player.traverse(obj => {
  if (obj.isMesh) obj.castShadow = true;
});

player.position.set(0, 0, 3);
scene.add(player);

// GAME VARIABLES
const lanes = [-2.3, 0, 2.3];
let lane = 1;
let score = 0;
let speed = 13;
let running = false;
let jumping = false;
let jumpVelocity = 0;
let spawnTimer = 0;
let lastTime = performance.now();

const objects = [];
const scoreText = document.getElementById("score");
const overlay = document.getElementById("overlay");
const title = document.getElementById("title");
const message = document.getElementById("message");
const startButton = document.getElementById("start");

// OBSTACLES
function addObstacle(z) {
  const group = new THREE.Group();

  const block = new THREE.Mesh(
    new THREE.BoxGeometry(1.15, 1, 0.9),
    woodMat
  );
  block.position.y = 0.5;
  group.add(block);

  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(1.17, 0.12, 0.92),
    material("#e9bb72")
  );
  stripe.position.y = 0.7;
  group.add(stripe);

  group.position.set(
    lanes[Math.floor(Math.random() * 3)],
    0,
    z
  );

  group.traverse(obj => {
    if (obj.isMesh) obj.castShadow = true;
  });

  scene.add(group);
  objects.push({ mesh: group, type: "obstacle" });
}

// COINS
function addCoin(z) {
  const coin = new THREE.Mesh(
    new THREE.CylinderGeometry(0.38, 0.38, 0.13, 12),
    goldMat
  );

  coin.rotation.x = Math.PI / 2;
  coin.position.set(
    lanes[Math.floor(Math.random() * 3)],
    1.2,
    z
  );

  scene.add(coin);
  objects.push({ mesh: coin, type: "coin" });
}

// START / RESTART
function resetGame() {
  for (const obj of objects) {
    scene.remove(obj.mesh);
  }
  objects.length = 0;

  score = 0;
  speed = 13;
  lane = 1;
  jumping = false;
  jumpVelocity = 0;
  spawnTimer = 0.5;

  player.position.set(0, 0, 3);
  scoreText.textContent = "0";

  title.textContent = "Coin Run 3D";
  message.textContent = "Collect coins and avoid the blocks!";
  startButton.textContent = "Start Game";

  overlay.style.display = "none";
  running = true;
  lastTime = performance.now();
}

function endGame() {
  running = false;
  title.textContent = "Game Over!";
  message.textContent = `You collected ${score} coins. Try again!`;
  startButton.textContent = "Play Again";
  overlay.style.display = "grid";
}

startButton.addEventListener("click", resetGame);

// CONTROLS
function moveLeft() {
  if (running) lane = Math.max(0, lane - 1);
}

function moveRight() {
  if (running) lane = Math.min(2, lane + 1);
}

function jump() {
  if (running && !jumping) {
    jumping = true;
    jumpVelocity = 9;
  }
}

window.addEventListener("keydown", e => {
  if (
    ["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(e.key)
  ) e.preventDefault();

  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
    moveLeft();

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d")
    moveRight();

  if (
    e.key === "ArrowUp" ||
    e.key === " " ||
    e.key.toLowerCase() === "w"
  ) jump();

  if (!running && e.key === "Enter") resetGame();
});

document.getElementById("left").addEventListener("pointerdown", moveLeft);
document.getElementById("right").addEventListener("pointerdown", moveRight);
document.getElementById("jump").addEventListener("pointerdown", jump);

// MAIN GAME LOOP
function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) / 1000, 0.04);
  lastTime = now;

  if (running) {
    speed = Math.min(19, speed + dt * 0.1);

    // Move between lanes smoothly
    player.position.x = THREE.MathUtils.damp(
      player.position.x, lanes[lane], 13, dt
    );

    // Jump physics
    if (jumping) {
      player.position.y += jumpVelocity * dt;
      jumpVelocity -= 22 * dt;

      if (player.position.y <= 0) {
        player.position.y = 0;
        jumping = false;
        jumpVelocity = 0;
      }
    } else {
      player.position.y = Math.sin(now * 0.012) * 0.025;
    }

    // Spawn objects ahead
    spawnTimer -= dt;

    if (spawnTimer <= 0) {
      if (Math.random() < 0.55) {
        addObstacle(-48);
      } else {
        addCoin(-48);
      }

      if (Math.random() < 0.75) {
        addCoin(-55);
      }

      spawnTimer = 0.9 + Math.random() * 0.45;
    }

    // Move and detect collisions
    for (let i = objects.length - 1; i >= 0; i--) {
      const obj = objects[i];

      obj.mesh.position.z += speed * dt;

      if (obj.type === "coin") {
        obj.mesh.rotation.y += dt * 3;
      }

      const closeZ =
        Math.abs(obj.mesh.position.z - player.position.z) < 0.8;

      const closeX =
        Math.abs(obj.mesh.position.x - player.position.x) < 0.95;

      if (closeZ && closeX) {
        if (obj.type === "coin") {
          score++;
          scoreText.textContent = score;
          scene.remove(obj.mesh);
          objects.splice(i, 1);
          continue;
        }

        if (player.position.y < 0.65) {
          endGame();
          break;
        }
      }

      if (obj.mesh.position.z > 12) {
        scene.remove(obj.mesh);
        objects.splice(i, 1);
      }
    }

    // Camera follows the player
    camera.position.x = THREE.MathUtils.damp(
      camera.position.x, player.position.x * 0.25, 3, dt
    );
    camera.lookAt(player.position.x * 0.12, 1, -5);
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

// RESIZE
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
